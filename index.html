const BOT_NAMES = ["Bot-Karen", "Algorithmus-Achim", "KI-Kevin", "Cyber-Chantal", "Server-Siggi", "Roboter-Renate", "Maschinen-Mandy"];

const HAND_SIZE = 8;
const REDRAWS_PER_GAME = 2;
const STORAGE_KEY = "getriggert_state_v1";
// Glas-Intensität: "dezent" | "mittel" | "voll"
const GLASS_LEVEL = "dezent";
// Signatur der Kartendecks: ändert sich der Kartenbestand im Code, passen
// gespeicherte Karten-Indizes nicht mehr – alte Spielstände werden dann verworfen.
const DECK_SIG = BLACK_CARDS.length + ":" + WHITE_CARDS.length;

/* ============================================================
   State
   ============================================================ */

let S = null;
let _lastPhase = null; // für Scroll-to-top nur bei Phasenwechsel

function defaultState() {
  return {
    phase: "setup",
    deckSig: DECK_SIG,
    targetScore: 5,
    setupPlayers: [
      { name: "", isBot: false },
      { name: "", isBot: true },
      { name: "", isBot: true },
    ],
    players: [],
    blackDeck: [],
    blackDiscard: [],
    whiteDeck: [],
    whiteDiscard: [],
    czarIdx: 0,
    currentBlack: null,
    submissions: [],
    answerQueue: [],
    queuePos: 0,
    selectedCard: null,
    judgeSelected: null,
    lastRound: null,
    roundNum: 0,
    shards: [],
    helpOpen: false,
    pending: null,
  };
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) { /* Speicher voll/blockiert: Spiel läuft trotzdem weiter */ }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed.phase !== "string") return null;
    // Kartendecks im Code geändert? Dann zeigen gespeicherte Indizes auf
    // falsche Texte – laufendes Spiel verwerfen, Setup-Daten retten.
    if (parsed.phase !== "setup" && parsed.deckSig !== DECK_SIG) {
      const fresh = defaultState();
      if (Array.isArray(parsed.setupPlayers) && parsed.setupPlayers.length >= 3) fresh.setupPlayers = parsed.setupPlayers;
      if (typeof parsed.targetScore === "number") fresh.targetScore = parsed.targetScore;
      return fresh;
    }
    parsed.deckSig = DECK_SIG;
    return parsed;
  } catch (e) { return null; }
}

/* ============================================================
   Deck-Helfer
   ============================================================ */

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawWhite() {
  if (S.whiteDeck.length === 0) {
    S.whiteDeck = shuffle(S.whiteDiscard);
    S.whiteDiscard = [];
  }
  return S.whiteDeck.pop();
}

function drawBlack() {
  if (S.blackDeck.length === 0) {
    S.blackDeck = shuffle(S.blackDiscard);
    S.blackDiscard = [];
  }
  return S.blackDeck.pop();
}

function refillHand(player) {
  while (player.hand.length < HAND_SIZE && (S.whiteDeck.length > 0 || S.whiteDiscard.length > 0)) {
    player.hand.push(drawWhite());
  }
}

/* ============================================================
   Spiel-Logik
   ============================================================ */

function startGame() {
  const setup = S.setupPlayers;
  const humans = setup.filter(p => !p.isBot).length;
  if (setup.length < 3 || humans < 1) return;

  let botCount = 0, humanCount = 0;
  const players = setup.map(p => {
    let name = (p.name || "").trim();
    if (!name) {
      name = p.isBot ? BOT_NAMES[botCount % BOT_NAMES.length] : "Spieler " + (humanCount + 1);
    }
    if (p.isBot) botCount++; else humanCount++;
    return { name, isBot: p.isBot, score: 0, hand: [], redraws: REDRAWS_PER_GAME };
  });

  S.players = players;
  S.blackDeck = shuffle(BLACK_CARDS.map((_, i) => i));
  S.blackDiscard = [];
  S.whiteDeck = shuffle(WHITE_CARDS.map((_, i) => i));
  S.whiteDiscard = [];
  S.czarIdx = Math.floor(Math.random() * players.length);
  S.roundNum = 0;
  S.lastRound = null;
  S.shards = [];
  players.forEach(refillHand);
  startRound();
}

// Bots spielen sofort verdeckt eine zufällige Karte
function botsSubmit() {
  S.players.forEach((p, idx) => {
    if (idx === S.czarIdx || !p.isBot) return;
    const cardPos = Math.floor(Math.random() * p.hand.length);
    const cardIdx = p.hand.splice(cardPos, 1)[0];
    S.submissions.push({ playerIdx: idx, cardIdx });
  });
}

function startRound() {
  S.roundNum++;
  S.currentBlack = drawBlack();
  S.submissions = [];
  S.selectedCard = null;
  S.judgeSelected = null;

  botsSubmit();

  // Menschen kommen nacheinander dran (Hot-Seat)
  S.answerQueue = S.players
    .map((p, idx) => ({ p, idx }))
    .filter(({ p, idx }) => idx !== S.czarIdx && !p.isBot)
    .map(({ idx }) => idx);
  S.queuePos = 0;

  if (S.answerQueue.length === 0) {
    goJudge();
  } else {
    S.phase = "pass_answer";
  }
  save();
  render();
}

function showHand() {
  S.phase = "answer";
  S.selectedCard = null;
  save();
  render();
}

function selectCard(pos) {
  S.selectedCard = pos;
  render();
}

function submitCard() {
  if (S.selectedCard === null) return;
  const playerIdx = S.answerQueue[S.queuePos];
  const player = S.players[playerIdx];
  const cardIdx = player.hand.splice(S.selectedCard, 1)[0];
  S.submissions.push({ playerIdx, cardIdx });
  S.selectedCard = null;
  S.queuePos++;
  if (S.queuePos >= S.answerQueue.length) {
    goJudge();
  } else {
    S.phase = "pass_answer";
  }
  save();
  render();
}

function redrawHand() {
  const player = S.players[S.answerQueue[S.queuePos]];
  if (!player || player.redraws <= 0) return;
  askConfirm("Komplette Hand abwerfen und " + HAND_SIZE + " neue Karten ziehen? (Noch " + player.redraws + "× möglich)", "redraw", "Hand tauschen");
}

function _doRedraw() {
  const player = S.players[S.answerQueue[S.queuePos]];
  if (!player || player.redraws <= 0) return;
  player.redraws--;
  S.whiteDiscard.push(...player.hand);
  player.hand = [];
  refillHand(player);
  S.selectedCard = null;
  save();
  render();
}

function skipBlack() {
  askConfirm("Schwarze Karte skippen? Sie wird ersetzt, bereits gespielte Antworten gehen zurück auf die Hand.", "skip", "Skippen");
}

function _doSkip() {
  S.submissions.forEach(s => S.players[s.playerIdx].hand.push(s.cardIdx));
  S.submissions = [];
  S.blackDiscard.push(S.currentBlack);
  S.currentBlack = drawBlack();
  S.selectedCard = null;
  S.judgeSelected = null;

  botsSubmit();
  S.queuePos = 0;
  if (S.answerQueue.length === 0) {
    goJudge();
  } else {
    S.phase = "pass_answer";
  }
  save();
  render();
}

function goJudge() {
  S.submissions = shuffle(S.submissions);
  const czar = S.players[S.czarIdx];
  if (czar.isBot) {
    // Bot-Boss entscheidet gnadenlos zufällig
    finishRound(Math.floor(Math.random() * S.submissions.length));
  } else {
    S.phase = "pass_judge";
  }
}

function showJudging() {
  S.phase = "judge";
  S.judgeSelected = null;
  save();
  render();
}

function selectWinner(pos) {
  S.judgeSelected = pos;
  render();
}

function confirmWinner() {
  if (S.judgeSelected === null) return;
  finishRound(S.judgeSelected);
  save();
  render();
}

function finishRound(winnerPos) {
  const winSub = S.submissions[winnerPos];
  const winner = S.players[winSub.playerIdx];
  winner.score++;

  S.lastRound = {
    blackIdx: S.currentBlack,
    czarName: S.players[S.czarIdx].name,
    czarIsBot: S.players[S.czarIdx].isBot,
    winnerName: winner.name,
    winningCardIdx: winSub.cardIdx,
    reveals: S.submissions.map(s => ({
      name: S.players[s.playerIdx].name,
      cardIdx: s.cardIdx,
      won: s === winSub,
    })),
  };

  // Karten abräumen
  S.submissions.forEach(s => S.whiteDiscard.push(s.cardIdx));
  S.blackDiscard.push(S.currentBlack);
  S.submissions = [];
  S.currentBlack = null;

  if (winner.score >= S.targetScore) {
    S.phase = "gameover";
    S.shards = makeShards(30);
  } else {
    S.phase = "result";
  }
  save();
  render();
}

function nextRound() {
  S.czarIdx = (S.czarIdx + 1) % S.players.length;
  S.players.forEach(refillHand);
  startRound();
}

function newGame() {
  const keep = S.setupPlayers;
  const target = S.targetScore;
  S = defaultState();
  S.setupPlayers = keep;
  S.targetScore = target;
  save();
  render();
}

function toggleHelp() {
  S.helpOpen = !S.helpOpen;
  render();
}

/* ============================================================
   Bestätigungs-Dialog (Glas-Modal statt nativem confirm)
   ============================================================ */

function askConfirm(message, type, yes) {
  S.pending = { message, type, yes };
  render();
}

function cancelConfirm() {
  S.pending = null;
  render();
}

function doConfirm() {
  const p = S.pending;
  S.pending = null;
  if (!p) { render(); return; }
  if (p.type === "reset") _doReset();
  else if (p.type === "redraw") _doRedraw();
  else if (p.type === "skip") _doSkip();
  else render();
}

function resetAll() {
  askConfirm("Wirklich alles zurücksetzen? Der Spielstand wird gelöscht.", "reset", "Zurücksetzen");
}

function _doReset() {
  const keepPlayers = S && S.setupPlayers ? S.setupPlayers : null;
  S = defaultState();
  if (keepPlayers) S.setupPlayers = keepPlayers;
  save();
  render();
}

/* ============================================================
   Setup-Interaktionen
   ============================================================ */

function setupAddPlayer() {
  if (S.setupPlayers.length >= 8) return;
  S.setupPlayers.push({ name: "", isBot: true });
  save();
  render();
}

function setupRemovePlayer(i) {
  if (S.setupPlayers.length <= 3) return;
  S.setupPlayers.splice(i, 1);
  save();
  render();
}

function setupToggleBot(i) {
  S.setupPlayers[i].isBot = !S.setupPlayers[i].isBot;
  save();
  render();
}

function setupName(i, val) {
  S.setupPlayers[i].name = val;
  save(); // kein render – Input behält den Fokus
}

function setupTarget(n) {
  S.targetScore = n;
  save();
  render();
}

/* ============================================================
   Konfetti-Scherben
   ============================================================ */

function makeShards(n) {
  const cols = ["rgba(255,45,120,.9)", "rgba(255,255,255,.85)", "rgba(170,120,255,.85)", "rgba(255,90,150,.9)"];
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push({
      left: Math.round(Math.random() * 100),
      size: 5 + Math.round(Math.random() * 6),
      rot: Math.round(Math.random() * 360),
      dur: (2.4 + Math.random() * 1.8).toFixed(2),
      delay: (Math.random() * 0.7).toFixed(2),
      col: cols[i % cols.length],
    });
  }
  return out;
}

const UNITLESS = new Set(["opacity", "fontWeight", "lineHeight", "zIndex", "flex", "flexGrow", "flexShrink", "order"]);

// Style-Objekt (camelCase) -> Inline-CSS-String
function css(o) {
  return Object.keys(o).filter(k => o[k] != null).map(k => {
    const prop = k.replace(/[A-Z]/g, m => "-" + m.toLowerCase());
    let v = o[k];
    if (typeof v === "number" && !UNITLESS.has(k)) v = v + "px";
    return prop + ":" + v;
  }).join(";");
}

/* ============================================================
   Rendering-Helfer
   ============================================================ */

function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// Schwarze Karte: ______ als Neon-Lücke hervorheben
function blackText(idx) {
  if (idx === null || idx === undefined) return "";
  const parts = String(BLACK_CARDS[idx]).split("______");
  return parts.map(esc).join('<span style="color:#ff2d78;font-weight:900;">______</span>');
}

function scoreboard(t) {
  const chips = S.players.map((p, i) => {

      ? { display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12, padding: "6px 11px", borderRadius: 999, border: "1px solid rgba(255,45,120,.6)", background: "rgba(255,45,120,.14)", color: "#ff2d78", boxShadow: "0 0 16px rgba(255,45,120,.32)", backdropFilter: "blur(12px)", WebkitBackdropFilter: "blur(12px)" }

    const scoreStyle = { fontWeight: 900, marginLeft: 2, color: czar ? "#ff2d78" : "#e7e5e4" };

    <button class="tap neon-btn" onclick="submitCard()" style="${css(submitStyle)}">${ok ? "VERDECKT EINREICHEN ✓" : "KARTE ANTIPPEN…"}</button>`;
}

function renderPassJudge(t) {
  const czar = S.players[S.czarIdx];
  return `
    ${header(t, "Alle Antworten sind drin")}
    ${scoreboard(t)}
    ${blackCardEl(t, S.currentBlack)}
    <div style="flex:1;display:grid;place-items:center;padding:36px 0;">
      <div style="text-align:center;animation:gtSlideUp .3s ease both;">
        <div style="font-size:52px;margin-bottom:16px;">⚖️</div>
        <p style="font-size:20px;font-weight:800;margin:0 0 24px;line-height:1.3;">Gib das Gerät an<br><span style="font-family:'Archivo Black',sans-serif;font-size:30px;color:#ff2d78;">${esc(czar.name)}</span></p>
        <p style="color:#a8a29e;font-size:14px;margin:0 0 24px;">Zeit für das Urteil des Empörungsbeauftragten.</p>
        <button class="tap neon-btn" onclick="showJudging()" style="${css(t.sBigNeon)}">URTEIL FÄLLEN ⚖</button>
      </div>
    </div>`;
}

function renderJudge(t) {
  const subs = S.submissions.map((s, pos) => {
    const sel = S.judgeSelected === pos;
    const style = Object.assign({}, t.lightBase, { textAlign: "left", width: "100%", padding: 16, fontSize: 14, fontWeight: 600, lineHeight: 1.3, cursor: "pointer" });
    if (sel) { style.border = "1px solid #ff2d78"; style.boxShadow = t.neonRing; }
    return `<button class="tap" onclick="selectWinner(${pos})" style="${css(style)}"><span style="font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:#78716c;display:block;margin-bottom:5px;">Einsendung #${pos + 1}</span>${esc(WHITE_CARDS[s.cardIdx])}</button>`;
  }).join("");

  const ok = S.judgeSelected !== null;
  const judgeStyle = ok
    ? Object.assign({}, t.bigBase, { width: "100%", padding: "16px", fontSize: 16, background: t.warnFill, boxShadow: "0 12px 30px rgba(255,59,48,.4), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 6px rgba(150,0,20,.35)" })
    : Object.assign({}, t.sBigNeonFull, t.disabledBtn);

  return `
    ${header(t, "Wähle den Gewinner")}
    ${scoreboard(t)}
    ${blackCardEl(t, S.currentBlack)}
    ${skipBtn(t, "Alles Müll? Schwarze Karte skippen – Antworten gehen zurück")}
    <p style="font-size:12px;color:#78716c;margin:16px 0 10px;text-transform:uppercase;letter-spacing:.12em;">Anonyme Einsendungen – wähle die beste:</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">${subs}</div>
    <button class="tap neon-btn" onclick="confirmWinner()" style="${css(judgeStyle)}">${ok ? "GEWINNER KÜREN 🏆" : "EINSENDUNG ANTIPPEN…"}</button>`;
}

function renderResult(t) {
  const r = S.lastRound;
  const reveals = r.reveals.map(rv => {
    const nameStyle = { flexShrink: 0, fontWeight: 700, color: rv.won ? "#ff2d78" : "#78716c" };
    const rowStyle = rv.won
      ? { display: "flex", alignItems: "center", gap: 12, borderRadius: 14, padding: "10px 14px", fontSize: 13, border: "1px solid rgba(255,45,120,.6)", background: "rgba(255,45,120,.08)", boxShadow: "0 0 16px rgba(255,45,120,.2)", backdropFilter: "blur(10px)", WebkitBackdropFilter: "blur(10px)" }
      : { display: "flex", alignItems: "center", gap: 12, borderRadius: 14, padding: "10px 14px", fontSize: 13, border: "1px solid rgba(255,255,255,.1)", background: "rgba(255,255,255,.04)", backdropFilter: "blur(10px)", WebkitBackdropFilter: "blur(10px)" };
    const tag = (rv.won ? "🏆 " : "💀 ") + rv.name;
    return `<div style="${css(rowStyle)}"><span style="${css(nameStyle)}">${esc(tag)}</span><span style="color:#d6d3d1;line-height:1.3;">${esc(WHITE_CARDS[rv.cardIdx])}</span></div>`;
  }).join("");

  return `
    ${header(t, "Rundenergebnis")}
    ${scoreboard(t)}
    <div style="${css(t.sDark)}">
      <p style="font-size:14px;font-weight:700;line-height:1.36;color:#a8a29e;margin:0 0 12px;">${blackText(r.blackIdx)}</p>
      <div style="${css(t.winnerCardStyle)}">
        <span style="font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:#ff2d78;font-weight:900;display:block;margin-bottom:5px;">🏆 Siegerkarte – ${esc(r.winnerName)}</span>
        <p style="font-size:16px;font-weight:800;line-height:1.3;margin:0;">${esc(WHITE_CARDS[r.winningCardIdx])}</p>
      </div>
      ${r.czarIsBot ? `<p style="font-size:11px;color:#78716c;margin:12px 0 0;line-height:1.45;">🤖 ${esc(r.czarName)} hat als Bot-Boss völlig willkürlich entschieden. Wie im echten Internet.</p>` : ""}
    </div>
    <p style="font-size:12px;color:#78716c;margin:0 0 8px;text-transform:uppercase;letter-spacing:.12em;">Alle Einsendungen aufgedeckt:</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;max-height:280px;overflow-y:auto;">${reveals}</div>
    <button class="tap neon-btn" onclick="nextRound()" style="${css(t.sBigNeonFull)}">NÄCHSTE RUNDE ▶</button>`;
}

function renderGameOver(t) {
  const r = S.lastRound;
  const ranking = S.players.slice().sort((a, b) => b.score - a.score);
  const champ = ranking[0];
  const ranks = ranking.map((p, i) => {
    const rowStyle = { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "7px 0", fontSize: 14, color: i === 0 ? "#ff2d78" : "#d6d3d1", fontWeight: i === 0 ? 900 : 400 };
    const label = (i + 1) + ". " + p.name + (p.isBot ? " 🤖" : "");
    return `<div style="${css(rowStyle)}"><span>${esc(label)}</span><span style="font-weight:800;">${p.score}</span></div>`;
  }).join("");
  const shards = (S.shards || []).map(s => {
    const style = {
      position: "absolute", top: 0, left: s.left + "%", width: s.size + "px", height: (s.size * 2.4) + "px",
      background: s.col, borderRadius: "2px", opacity: 0, transform: "rotate(" + s.rot + "deg)",
      boxShadow: "0 0 10px " + s.col, animation: "gtShard " + s.dur + "s linear " + s.delay + "s 1 both",
    };
    return `<div style="${css(style)}"></div>`;
  }).join("");

  return `
    ${header(t, "Spielende")}
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0;position:relative;">
      <div style="position:absolute;inset:-40px 0 0;pointer-events:none;overflow:hidden;z-index:0;">${shards}</div>
      <div style="text-align:center;margin-bottom:24px;animation:gtSlideUp .35s ease both;position:relative;z-index:1;">
        <div style="font-size:64px;margin-bottom:12px;">🏆</div>
        <p style="color:#a8a29e;font-size:14px;margin:0 0 4px;">Offiziell am meisten getriggert hat:</p>
        <p style="font-family:'Archivo Black',sans-serif;font-size:40px;color:#ff2d78;margin:0 0 8px;line-height:1;">${esc(champ.name)}</p>
        <p style="font-size:12px;color:#78716c;margin:0;">${champ.score} Punkte – eine Karriere als Empörungsbeauftragter winkt.</p>
      </div>
      <div style="${css(t.sDark)}">
        <p style="font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:#78716c;margin:0 0 8px;">Finale Siegerkarte</p>
        <p style="font-size:14px;color:#a8a29e;line-height:1.36;margin:0 0 12px;">${blackText(r.blackIdx)}</p>
        <div style="${css(t.sLightPlain)}">
          <p style="font-size:16px;font-weight:800;line-height:1.3;margin:0;">${esc(WHITE_CARDS[r.winningCardIdx])}</p>
        </div>
      </div>
      <div style="${css(t.sPanel)}">
        <p style="font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#78716c;margin:0 0 10px;">Endstand</p>
        ${ranks}
      </div>
      <button class="tap neon-btn" onclick="newGame()" style="${css(t.sBigNeonFull)}">NEUES SPIEL ▶</button>
    </div>`;
}

/* ============================================================
   Rendering – Overlays
   ============================================================ */

function helpOverlay(t) {
  return `
  <div onclick="if(event.target===this)toggleHelp()" style="position:fixed;inset:0;z-index:50;background:rgba(4,4,6,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-y:auto;">
    <div style="max-width:600px;margin:0 auto;padding:calc(32px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));">
      <div style="${css(t.sOverlayCard)}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;">
          <h2 style="font-family:'Archivo Black',sans-serif;font-size:22px;line-height:1.1;margin:0;">SO WIRST DU<br><span style="color:#ff2d78;">GETRIGGERT!</span></h2>
          <button class="tap" onclick="toggleHelp()" style="flex-shrink:0;width:36px;height:36px;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#a8a29e;cursor:pointer;">✕</button>
        </div>

        <div style="margin-bottom:20px;">
          <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:#ff2d78;font-weight:900;margin:0 0 8px;">🎯 Das Ziel</h3>
          <p style="font-size:14px;color:#d6d3d1;line-height:1.6;margin:0;">Wirf auf jede schwarze Fragekarte die fieseste weiße Antwort aus deiner Hand. Überzeugt sie den Empörungsbeauftragten, kassierst du den Punkt – und wer zuerst das Punkteziel erreicht, hat offiziell <b style="color:#e7e5e4;">am meisten getriggert</b> und gewinnt. Mehr gibt es nicht. Außer der Wahrheit über deine Freunde.</p>
        </div>

        <div style="margin-bottom:20px;">
          <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:#ff2d78;font-weight:900;margin:0 0 8px;">🃏 Der Ablauf</h3>
          <div style="display:flex;flex-direction:column;gap:8px;font-size:14px;color:#d6d3d1;line-height:1.55;">
            <div><b style="color:#e7e5e4;">1.</b> Pro Runde ist einer der <b style="color:#ff2d78;">Empörungsbeauftragte</b> 👑. Er zieht die schwarze Karte, lehnt sich zurück und urteilt am Ende. Mehr Macht hatte er nie.</div>
            <div><b style="color:#e7e5e4;">2.</b> Alle anderen wählen <b style="color:#e7e5e4;">verdeckt</b> ihre Antwortkarte. Dafür wandert das Gerät reihum. Nicht spicken – sonst gibt's eine Anzeige.</div>
            <div><b style="color:#e7e5e4;">3.</b> Bots reichen automatisch ein. Sofort, zufällig, ohne Gewissen. Wie der Algorithmus eben.</div>
            <div><b style="color:#e7e5e4;">4.</b> Der Beauftragte sieht alle Antworten <b style="color:#e7e5e4;">anonym</b> und kürt die beste. Der Gewinner kassiert den Punkt.</div>
            <div><b style="color:#e7e5e4;">5.</b> Danach wird aufgedeckt, wer was gespielt hat. Viel Spaß beim nächsten Familienfest.</div>
            <div><b style="color:#e7e5e4;">6.</b> Karten nachziehen, Krone rotiert, nächste Runde. Bis einer heult oder gewinnt.</div>
          </div>
        </div>

        <div style="margin-bottom:24px;">
          <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:#ff2d78;font-weight:900;margin:0 0 8px;">🆘 Die Notfall-Mechaniken</h3>
          <p style="font-size:14px;color:#d6d3d1;line-height:1.6;margin:0 0 8px;"><b style="color:#e7e5e4;">🔄 Neue Hand:</b> Deine Karten sind so schlecht, dass nicht mal die Lücke sie will? ${REDRAWS_PER_GAME}× pro Spiel darfst du die komplette Hand tauschen. Danach: mit den Entscheidungen leben. Wie im echten Leben.</p>
          <p style="font-size:14px;color:#d6d3d1;line-height:1.6;margin:0;"><b style="color:#e7e5e4;">⏭ Karte skippen:</b> Die schwarze Karte zündet nicht? Überspringen geht jederzeit – bereits gespielte Antworten kommen zurück auf die Hand. Niemand verliert etwas. Außer Zeit.</p>
        </div>

        <button class="tap neon-btn" onclick="toggleHelp()" style="${css(t.sBigNeonFull)}">KAPIERT. EMPÖR MICH! ▶</button>
      </div>
    </div>
  </div>`;
}

function confirmOverlay(t) {
  const p = S.pending;
  return `
  <div style="position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(4,4,6,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);">
    <div style="${css(t.sConfirmCard)}">
      <p style="font-size:15px;line-height:1.5;color:#e7e5e4;margin:0 0 20px;">${esc(p.message)}</p>
      <div style="display:flex;gap:10px;">
        <button class="tap" onclick="cancelConfirm()" style="${css(t.sConfirmNo)}">Abbrechen</button>
        <button class="tap" onclick="doConfirm()" style="${css(t.sConfirmYes)}">${esc(p.yes || "Ja")}</button>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   Render-Dispatch
   ============================================================ */

function render() {
  const app = document.getElementById("app");
  const t = theme();
  let html = "";
  switch (S.phase) {
    case "setup":       html = renderSetup(t); break;
    case "pass_answer": html = renderPassAnswer(t); break;
    case "answer":      html = renderAnswer(t); break;
    case "pass_judge":  html = renderPassJudge(t); break;
    case "judge":       html = renderJudge(t); break;
    case "result":      html = renderResult(t); break;
    case "gameover":    html = renderGameOver(t); break;
    default:
      S = defaultState();
      html = renderSetup(t);
  }
  if (S.helpOpen) html += helpOverlay(t);
  if (S.pending) html += confirmOverlay(t);
  app.innerHTML = html;
  if (S.phase !== _lastPhase) {
    _lastPhase = S.phase;
    window.scrollTo(0, 0);
  }
}

/* ============================================================
   Init
   ============================================================ */

S = load() || defaultState();
// Wer mitten in einer Kartenauswahl neu lädt, landet sicherheitshalber wieder
// auf dem Übergabe-Screen – so sieht niemand fremde Handkarten.
if (S.phase === "answer") S.phase = "pass_answer";
if (S.phase === "judge") S.phase = "pass_judge";
S.selectedCard = null;
S.judgeSelected = null;
S.helpOpen = false;
S.pending = null;
if (!Array.isArray(S.shards)) S.shards = [];
render();
</script>
</body>
</html>
